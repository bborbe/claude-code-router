# claude-code-router example config
# Copy to ~/.config/claude-code-router/config.yaml and chmod 600 (XDG; falls back to legacy ~/.claude-code-router/config.yaml if that's the only one present)
# Full reference: docs/config.md

router:
  default_provider: anthropic-subscription

# Per-request trace logging for /v1/* traffic.
# When true, writes one JSON file per request to ~/.claude-code-router/trace/
# (Authorization + x-api-key headers redacted to ***; bodies verbatim).
# Default false — omit or set false for no trace files.
trace: false

# allowedApiKeys:            # optional; uncomment + list caller keys to require x-api-key auth on /v1/*
#   - "<CALLER_API_KEY>"     # and to route those callers to a provider (see docs/config.md ## Routing by API key)

providers:

  anthropic-subscription:
    upstream: https://api.anthropic.com
    # no token: → router forwards client's Authorization header
    #   (Claude Code's subscription OAuth bearer passes through untouched)
    models:
      - "claude-opus-*"
      - "claude-sonnet-*"
      - "claude-haiku-*"
      - "opus"
      - "sonnet"
      - "haiku"

  minimax:
    upstream: https://api.minimax.io/anthropic
    token: "<YOUR_MINIMAX_API_KEY>"
    # window:                     # optional; legacy single-upstream form only — applies to the implicit single member (see docs/config.md ## Time-of-day windows). Cannot be combined with upstreams:.
    #   from: "08:00 Europe/Berlin"
    #   until: "18:00 Europe/Berlin"
    # allowedApiKeys:            # optional; keys that route to THIS provider, overriding model globs
    #   - "<ROUTING_KEY>"
    models:
      - "MiniMax-*"

  ollama-local:
    upstream: http://localhost:11434
    token: "ollama"
    models:
      - "qwen*"
    # Models whose chat template rejects a system message that is not the
    # first entry (qwen3.8 does; qwen3.6 on the same server does not).
    # The router lifts misplaced system messages into the top-level system
    # block for matching models. Omit or leave empty for no transform.
    requiresLeadingSystem:
      - "qwen3.8*"
    # Concurrency cap for this provider (optional; see docs/config.md ## Concurrency limit).
    # Example use: stay under a shared vllm.seibert.tools per-user ceiling of 8 by setting
    # maxConcurrentRequests: 8 on each seibert vllm provider that points at it.
    # maxConcurrentRequests: 8     # optional; cap concurrent /v1/* requests to this provider. Absent or 0 or negative = unlimited.
    # maxConcurrentWaitSeconds: 30 # optional; how long a queued request waits for a slot before HTTP 429 (default 30)
    # upstreams:                   # optional; alternative to `upstream:` — a pool of servers (see docs/config.md ## Upstream pools).
    #   - upstream: http://localhost:11434
    #     token: "ollama"
    #     weight: 1
    #     window:                   # optional; per-member time-of-day eligibility window (see docs/config.md ## Time-of-day windows). from/until in "HH:MM <location>" form.
    #       from: "08:00 Europe/Berlin"
    #       until: "18:00 Europe/Berlin"
    #     maxConcurrentRequests: 8
    #     maxConcurrentWaitSeconds: 30
    #   - upstream: http://localhost:11435
    #     weight: 1

# Short names that map to full model identifiers.
# Operator-facing only — the upstream always sees the resolved full name.
# Single-hop, case-sensitive. Add new entries here without code changes.
aliases:
  qwen: qwen3.6:35b-a3b-coding-nvfp4
  minimax: MiniMax-M3-highspeed
  opus: claude-opus-4-7

# model_pools:                 # optional; invented model names that resolve to a choice of providers (see docs/config.md ## Model pools).
#   coding:
#     - provider: deepseek-pool      # required; must exist under providers:
#       model: deepseek-v4-flash     # required; the fixed concrete model this member serves
#       weight: 2                    # optional; default 1. Share of pinned sessions this member receives.
#       overflow: true               # optional; default false. Allow failover to a sibling when this member's provider is saturated.
#     - provider: minimax-pool
#       model: MiniMax-2.7
