name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Binary install, not apt: the runner moved to Ubuntu 26.04 (resolute),
      # which dropped `apt-key` and for which the trivy apt suite does not
      # exist. Pinned so a trivy release cannot change CI behaviour unannounced.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.76.2
          trivy --version

      - name: Run precommit checks
        run: make precommit
