{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-code-router.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secretEnv }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
