apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-code-router.labels" . | nindent 4 }}
  {{- if .Values.keel.enabled }}
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: {{ .Values.keel.pollSchedule | quote }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-code-router
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-code-router
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.listen | trimPrefix ":" | quote }}
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
        {{- with .Values.rolloutNonce }}
        random: {{ . | quote }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: claude-code-router
          image: {{ include "claude-code-router.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -v={{ .Values.logLevel }}
          env:
            - name: LISTEN
              value: {{ .Values.listen | quote }}
            - name: CONFIG_PATH
              value: /etc/claude-code-router/config.yaml
            {{- if .Values.existingSecret }}
            - name: SECRET_FROM
              value: {{ .Values.existingSecret | quote }}
            {{- end }}
            {{- if .Values.secretEnv }}
            {{- range $k, $v := .Values.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}
                  key: {{ $k }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listen | trimPrefix ":" | int }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 5
            initialDelaySeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/claude-code-router
              readOnly: true
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          {{- if eq (include "claude-code-router.configKind" .) "Secret" }}
          secret:
            secretName: {{ include "claude-code-router.configObject" . }}
          {{- else }}
          configMap:
            name: {{ include "claude-code-router.configObject" . }}
          {{- end }}
